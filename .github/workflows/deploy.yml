name: Deploy Rin Index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-drive-index
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Prepare browser assets and Wrangler
        run: |
          npm pack --silent --ignore-scripts --pack-destination "$RUNNER_TEMP" markdown-it@15.0.3
          mkdir -p public/assets/vendor
          tar -xOzf "$RUNNER_TEMP/markdown-it-15.0.3.tgz" package/dist/browser/markdown-it.umd.min.js > public/assets/vendor/markdown-it.min.js
          tar -xOzf "$RUNNER_TEMP/markdown-it-15.0.3.tgz" package/LICENSE > public/assets/vendor/markdown-it-LICENSE.txt
          npm install --global wrangler@4.162.0

      - name: Check the Worker and folder downloads
        run: |
          node --check public/assets/js/app.js
          node --test

      - name: Verify Google Drive access
        run: node scripts/prepare-deploy.mjs "$RUNNER_TEMP/rin-worker-secrets.json"
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          INDEX_PASSWORD: ${{ secrets.INDEX_PASSWORD }}
          DRIVE_ROOT_ID: ${{ secrets.DRIVE_ROOT_ID }}
          INDEX_PUBLIC: ${{ secrets.INDEX_PUBLIC }}
          INDEX_USERNAME: ${{ secrets.INDEX_USERNAME }}
          PROTECT_FILE_LINK: ${{ secrets.PROTECT_FILE_LINK }}
          SITE_NAME: ${{ secrets.SITE_NAME }}

      - name: Deploy to Cloudflare
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository secret}"
          if [[ -n "$R2_ARCHIVE_BUCKET" ]]; then
            if [[ ! "$R2_ARCHIVE_BUCKET" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]; then
              echo "Set R2_ARCHIVE_BUCKET to a valid R2 bucket name." >&2
              exit 1
            fi
            printf '\n[[r2_buckets]]\nbinding = "RIN_ARCHIVES"\nbucket_name = "%s"\n' "$R2_ARCHIVE_BUCKET" >> wrangler.toml
          fi
          wrangler deploy --secrets-file "$RUNNER_TEMP/rin-worker-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARCHIVE_BUCKET: ${{ secrets.R2_ARCHIVE_BUCKET }}

      - name: Remove temporary secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/rin-worker-secrets.json"
